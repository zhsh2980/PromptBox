name: Release
on:
  push:
    tags:
      - 'v*'           # 推送 v* tag 时自动构建并创建 Release
  workflow_dispatch:   # 手动触发
    inputs:
      create_release:
        description: '是否创建 GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release 标签名（留空则使用配置文件版本号）'
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS-ARM64
            arch: aarch64
            webview2: false

          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS-Intel
            arch: x86_64
            webview2: false

          # Windows 普通版本
          - platform: windows-latest
            args: ''
            name: Windows
            webview2: false

          # Windows WebView2 版本
          - platform: windows-latest
            args: ''
            name: Windows-WebView2
            webview2: true

    runs-on: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && format('{0}-apple-darwin', matrix.arch) || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Windows: 切换到 WebView2 配置
      - name: Use WebView2 config
        if: matrix.platform == 'windows-latest' && matrix.webview2 == true
        run: |
          Copy-Item "src-tauri/tauri.conf.webview2.json" "src-tauri/tauri.conf.json" -Force
          Write-Host "Switched to WebView2 config"
        shell: pwsh

      # 构建应用
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # 读取版本号（从 Cargo.toml - 单一数据源）
      - name: Get version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Windows: 重命名 NSIS 安装包
      - name: Rename Windows installer
        if: matrix.platform == 'windows-latest'
        run: |
          # 从 Cargo.toml 读取版本号
          $version = (Get-Content "src-tauri/Cargo.toml" | Select-String '^version = "(.+)"').Matches.Groups[1].Value
          $bundleDir = "src-tauri/target/release/bundle/nsis"

          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Filter "*.exe" | ForEach-Object {
              if ("${{ matrix.webview2 }}" -eq "true") {
                $newName = "PromptLog-Windows-v$version-setup-webview2.exe"
              } else {
                $newName = "PromptLog-Windows-v$version-setup.exe"
              }

              $newPath = Join-Path $bundleDir $newName
              Move-Item $_.FullName $newPath -Force
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
        shell: pwsh

      # macOS: 重命名 DMG
      - name: Rename macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          # 从 Cargo.toml 读取版本号
          VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')

          # macOS 使用 --target 参数，输出目录包含架构名称
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
            NEW_NAME="PromptLog-macOS-ARM64-v${VERSION}.dmg"
          else
            BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
            NEW_NAME="PromptLog-macOS-Intel-v${VERSION}.dmg"
          fi

          if [ -d "$BUNDLE_DIR" ]; then
            for dmg in "$BUNDLE_DIR"/*.dmg; do
              if [ -f "$dmg" ]; then
                NEW_PATH="$BUNDLE_DIR/$NEW_NAME"
                mv "$dmg" "$NEW_PATH"
                echo "Renamed: $(basename $dmg) -> $NEW_NAME"
              fi
            done
          else
            echo "Warning: Bundle directory not found: $BUNDLE_DIR"
            ls -la src-tauri/target/ || true
          fi
        shell: bash

      # Windows: 创建 Portable ZIP
      - name: Create Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # 从 Cargo.toml 读取版本号
          $version = (Get-Content "src-tauri/Cargo.toml" | Select-String '^version = "(.+)"').Matches.Groups[1].Value
          $exePath = "src-tauri/target/release/promptlog.exe"

          if (Test-Path $exePath) {
            $tempDir = "portable-temp"
            New-Item -ItemType Directory -Path $tempDir -Force
            Copy-Item $exePath "$tempDir/promptlog.exe"

            # 如果是 WebView2 版本，下载 WebView2 Runtime
            if ("${{ matrix.webview2 }}" -eq "true") {
              Write-Host "Downloading WebView2 Runtime standalone installer..."
              $webview2Url = "https://github.com/aedancullen/webview2-evergreen-standalone-installer-archive/releases/latest/download/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
              $webview2Path = "$tempDir/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

              try {
                # 使用 curl 下载
                curl.exe -L -o $webview2Path $webview2Url

                # 验证文件是否下载成功且大小合理（至少 100MB）
                if (Test-Path $webview2Path) {
                  $fileSize = (Get-Item $webview2Path).Length / 1MB
                  Write-Host "WebView2 Runtime downloaded: $([math]::Round($fileSize, 2)) MB"

                  if ($fileSize -lt 100) {
                    throw "Downloaded file is too small ($([math]::Round($fileSize, 2)) MB), expected at least 100MB"
                  }
                } else {
                  throw "WebView2 installer file not found after download"
                }
              } catch {
                Write-Host "Error: Failed to download WebView2 Runtime: $_"
                throw "WebView2 download failed - cannot create webview2 package without it"
              }
            }

            # 创建说明文件
            if ("${{ matrix.webview2 }}" -eq "true") {
              "PromptLog Portable (with WebView2 Runtime)" | Out-File "$tempDir/README.txt" -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "此版本包含完整的 WebView2 Runtime 离线安装器，可完全离线使用。" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "首次使用步骤：" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "1. 解压到任意目录" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "2. 双击运行 MicrosoftEdgeWebView2RuntimeInstallerX64.exe 安装 WebView2" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "3. 安装完成后，运行 promptlog.exe" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "注意：" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "- WebView2 Runtime 只需安装一次，系统全局可用" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "- 如果系统已安装 WebView2，可直接运行 promptlog.exe，无需再次安装" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "版本：$version" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8

              $zipName = "PromptLog-Windows-Portable-v$version-webview2.zip"
            } else {
              "PromptLog Portable" | Out-File "$tempDir/README.txt" -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "使用方法：" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "1. 解压到任意目录" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "2. 双击 promptlog.exe 运行" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "注意：需要系统已安装 WebView2 Runtime" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "版本：$version" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8

              $zipName = "PromptLog-Windows-Portable-v$version.zip"
            }

            Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName -Force
            Remove-Item -Recurse -Force $tempDir
            Write-Host "Created: $zipName"
          }

      # 上传到 Artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
            PromptLog-Windows-Portable-*.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 仅在 tag 触发或手动触发且选择创建 Release 时执行
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载所有 artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 显示下载的文件结构（调试用）
      - name: Display structure of downloaded files
        run: ls -R artifacts

      # 确定 Release tag
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Tag 触发：使用 git tag
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # 手动触发：使用输入的 tag 或从 Cargo.toml 读取版本号
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            else
              VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
              echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
            fi
          fi

      # 创建 Release 并上传所有文件
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
