name: Release
on:
  push:
    tags:
      - 'v*'           # 推送 v* tag 时自动构建并创建 Release
  workflow_dispatch:   # 手动触发
    inputs:
      create_release:
        description: '是否创建 GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release 标签名（留空则使用配置文件版本号）'
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS-ARM64
            arch: aarch64
            webview2: false

          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS-Intel
            arch: x86_64
            webview2: false

          # Windows 普通版本
          - platform: windows-latest
            args: ''
            name: Windows
            webview2: false

          # Windows WebView2 版本
          - platform: windows-latest
            args: ''
            name: Windows-WebView2
            webview2: true

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      # Windows: 切换到 WebView2 配置
      - name: Use WebView2 config
        if: matrix.platform == 'windows-latest' && matrix.webview2 == true
        run: |
          Copy-Item "src-tauri/tauri.conf.webview2.json" "src-tauri/tauri.conf.json" -Force
          Write-Host "Switched to WebView2 config"
        shell: pwsh

      # 构建应用
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # 读取版本号（用于手动触发时的 Release 标签）
      - name: Get version from config
        id: get_version
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            VERSION=$(powershell -Command "(Get-Content 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version")
          else
            VERSION=$(cat src-tauri/tauri.conf.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Windows: 重命名 NSIS 安装包
      - name: Rename Windows installer
        if: matrix.platform == 'windows-latest'
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version
          $bundleDir = "src-tauri/target/release/bundle/nsis"

          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Filter "*.exe" | ForEach-Object {
              if ("${{ matrix.webview2 }}" -eq "true") {
                $newName = "PromptLog-Windows-v$version-setup-webview2.exe"
              } else {
                $newName = "PromptLog-Windows-v$version-setup.exe"
              }

              $newPath = Join-Path $bundleDir $newName
              Move-Item $_.FullName $newPath -Force
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
        shell: pwsh

      # macOS: 重命名 DMG
      - name: Rename macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          VERSION=$(cat src-tauri/tauri.conf.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')
          BUNDLE_DIR="src-tauri/target/release/bundle/dmg"

          if [ -d "$BUNDLE_DIR" ]; then
            for dmg in "$BUNDLE_DIR"/*.dmg; do
              if [ -f "$dmg" ]; then
                if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
                  NEW_NAME="PromptLog-macOS-ARM64-v${VERSION}.dmg"
                else
                  NEW_NAME="PromptLog-macOS-Intel-v${VERSION}.dmg"
                fi

                NEW_PATH="$BUNDLE_DIR/$NEW_NAME"
                mv "$dmg" "$NEW_PATH"
                echo "Renamed: $(basename $dmg) -> $NEW_NAME"
              fi
            done
          fi
        shell: bash

      # Windows: 创建 Portable ZIP
      - name: Create Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version
          $exePath = "src-tauri/target/release/promptlog.exe"

          if (Test-Path $exePath) {
            $tempDir = "portable-temp"
            New-Item -ItemType Directory -Path $tempDir -Force
            Copy-Item $exePath "$tempDir/promptlog.exe"

            if ("${{ matrix.webview2 }}" -eq "true") {
              # 下载 WebView2 Runtime 离线安装器
              Write-Host "Downloading WebView2 Runtime..."
              $webview2Url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
              try {
                Invoke-WebRequest -Uri $webview2Url -OutFile "$tempDir/MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
                Write-Host "WebView2 Runtime downloaded successfully"
              } catch {
                Write-Host "Warning: Failed to download WebView2 Runtime: $_"
              }

              # 创建说明文件
              "PromptLog Portable (with WebView2 Runtime)" | Out-File "$tempDir/README.txt" -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "首次使用步骤：" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "1. 双击运行 MicrosoftEdgeWebview2Setup.exe 安装 WebView2 Runtime" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "2. 安装完成后，运行 promptlog.exe" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "注意：" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "- WebView2 Runtime 只需安装一次，全局可用" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "- 如果系统已安装 WebView2，可直接运行 promptlog.exe" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "- 完全离线，无需网络连接" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8
              "版本：$version" | Out-File "$tempDir/README.txt" -Append -Encoding UTF8

              $zipName = "PromptLog-Windows-Portable-v$version-webview2.zip"
            } else {
              $zipName = "PromptLog-Windows-Portable-v$version.zip"
            }

            Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName -Force
            Remove-Item -Recurse -Force $tempDir
            Write-Host "Created: $zipName"
          }

      # 上传到 Artifacts（用于调试和手动触发）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            PromptLog-Windows-Portable-*.zip
          if-no-files-found: warn

      # 上传到 Release（tag 触发或手动触发时）
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            PromptLog-Windows-Portable-*.zip
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('v{0}', steps.get_version.outputs.version) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
